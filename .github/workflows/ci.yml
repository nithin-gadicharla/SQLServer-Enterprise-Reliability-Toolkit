name: validation
on:
  workflow_call:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m sqlfluff parse --dialect tsql sql/
      - run: python -m sqlfluff parse --dialect tsql benchmarks/setup.sql
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
  powershell:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Pester tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Install-Module Pester -RequiredVersion 5.7.1 -Force -Scope CurrentUser
          Import-Module Pester -RequiredVersion 5.7.1
          Invoke-Pester -Path tests/Toolkit.Tests.ps1 -CI
  sql2022:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Start disposable SQL Server with validated TLS
        shell: bash
        run: |
          set -euo pipefail
          password="T!$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          echo "TOOLKIT_SQL_PASSWORD=$password" >> "$GITHUB_ENV"
          mkdir -p artifacts/tls
          openssl req -x509 -nodes -newkey rsa:2048 -days 2 -keyout artifacts/tls/server.key -out artifacts/tls/server.crt -subj '/CN=localhost' -addext 'subjectAltName=DNS:localhost' -addext 'basicConstraints=critical,CA:TRUE'
          sudo cp artifacts/tls/server.crt /usr/local/share/ca-certificates/toolkit.crt
          sudo update-ca-certificates
          printf '[network]\ntlscert = /var/opt/mssql/tls/server.crt\ntlskey = /var/opt/mssql/tls/server.key\nforceencryption = 1\n' > artifacts/tls/mssql.conf
          sudo chown -R 10001:0 artifacts/tls
          sudo chmod 600 artifacts/tls/server.key
          docker run -d --name toolkit-sql -p 1433:1433 -e ACCEPT_EULA=Y -e MSSQL_PID=Developer -e MSSQL_SA_PASSWORD="$password" -v "$PWD/artifacts/tls:/var/opt/mssql/tls:ro" -v "$PWD/artifacts/tls/mssql.conf:/var/opt/mssql/mssql.conf:ro" mcr.microsoft.com/mssql/server:2022-CU18-ubuntu-22.04
          ready=0
          for attempt in $(seq 1 60); do
            if docker logs toolkit-sql 2>&1 | grep -q 'SQL Server is now ready for client connections'; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = 1
      - name: Run SQL and serialization assertions
        shell: pwsh
        env:
          TOOLKIT_DISPOSABLE_SQL: '1'
        run: ./tests/Integration.ps1
      - name: Retain raw synthetic benchmark evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: synthetic-benchmark-${{ github.sha }}
          path: artifacts/benchmark/*/raw.json
          if-no-files-found: error
      - name: Remove lab
        if: always()
        shell: bash
        run: |
          docker rm -f toolkit-sql || true
          sudo rm -rf artifacts/tls
