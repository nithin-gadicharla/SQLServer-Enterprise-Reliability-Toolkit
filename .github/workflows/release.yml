name: release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - run: python scripts/package.py
      - name: Publish first prerelease candidate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create v0.2.0 artifacts/SQLServer-Enterprise-Reliability-Toolkit-v0.2.0.zip artifacts/SHA256SUMS --target "$GITHUB_SHA" --title 'v0.2.0 — Reliability toolkit release candidate' --notes-file docs/releases/v0.2.0.md --prerelease
